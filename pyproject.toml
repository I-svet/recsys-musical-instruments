[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "musical-instruments-recsys"
version = "0.1.0"
description = "Five recommenders implemented from scratch, with temporal full-catalog evaluation"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "pandas>=2.2,<3", "torch>=2.5,<3", "matplotlib>=3.9,<4", "psutil>=6,<8", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
recsys = "recsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
